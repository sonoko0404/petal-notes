name: Petal static pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/petal-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: petal-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; official tag resolved 2026-09-24
        with:
          persist-credentials: false
          sparse-checkout: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5; official tag resolved 2026-09-24
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3; official tag resolved 2026-09-24
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4; official tag resolved 2026-09-24
        id: deployment
